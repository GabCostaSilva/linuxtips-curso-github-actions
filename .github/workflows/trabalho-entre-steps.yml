name: Primeiro Workflow Linuxtips

on:
  push:
    branches:
      - main

jobs:
    giropops:
        runs-on: ubuntu-latest
        steps:
            - name: Confere versao do Ubuntu
              run: cat /etc/os-release
            
            - name: Exibir mensagem
              run: echo "Estou fazendo o curso de Github Actions da Linuxtips" > conteudo.txt
            
            - name: Qualquer outra coisa
              run: ls -lha
            
            - name: Le conteudo do arquivo
              run: cat conteudo.txt
