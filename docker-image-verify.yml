name: Docker Image Verify

on:
    workflow_dispatch:
      inputs:
        image-name:
          description: 'image:tag (ex alpine:latest)'
          required: true
          type: string
  
jobs:
  docker-image-verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker pull
        run: docker pull {{ inputs.image-name }}
    
      - name: Docker images
        run: docker images
      
      - name: Docker Scout
        uses: docker/scout-action@v1.24.0
        with:
          command: cves
          image: {{ inputs.image-name }}
         